name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege by default; no job in this workflow needs write access.
permissions:
  contents: read

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-build:
    name: Test Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]

    steps:
      # Actions are SHA-pinned (tags are mutable). To update, resolve the new
      # tag's commit SHA and replace the pin — do not revert to tag refs.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch as of pinning
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config \
            libtesseract-dev \
            libleptonica-dev \
            tesseract-ocr \
            tesseract-ocr-eng

      - name: Rust formatting check
        if: matrix.os == 'ubuntu-24.04'
        run: cargo fmt --all -- --check
        working-directory: src-tauri

      - name: Rust clippy
        if: matrix.os == 'ubuntu-24.04'
        run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: src-tauri

      - name: Rust tests
        run: cargo test --locked
        working-directory: src-tauri

      # This is the only host compiling the Linux engine/tests. Each curated
      # mutation must fail its named assertion (not merely fail compilation),
      # then pass after the script restores precisely its own source edit.
      - name: Tessdata fail-then-pass proof (Linux native)
        if: matrix.os == 'ubuntu-24.04'
        run: python3 scripts/check_tessdata_mutations.py --linux

      - name: Upload tessdata mutation evidence
        if: always() && matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: tessdata-mutation-evidence
          path: target/tessdata-mutations/
          if-no-files-found: error

      # Debug CI never needs signing/notarization — that is release-only.
      # This smoke build exercises the bundler on each platform (app/dmg/msi/
      # AppImage) without any Apple credentials.
      - name: Build Tauri (debug)
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --debug

      # Upload the built binary so cross-platform smoke tests can pull it
      # without a local toolchain (e.g. room-6 has no Rust).
      - name: Upload binary artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: clipocr-${{ matrix.os }}
          path: |
            target/debug/clipocr.exe
            target/debug/clipocr
            target/debug/bundle/**/*.msi
            target/debug/bundle/**/*.exe
            target/debug/bundle/**/*.AppImage
            target/debug/bundle/**/*.deb
          if-no-files-found: warn
