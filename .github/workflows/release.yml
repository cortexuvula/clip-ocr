name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.1.0)'
        required: true

# Least privilege by default; jobs that create/upload/publish the release
# override with contents: write.
permissions:
  contents: read

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
      version: ${{ steps.get_version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Get version
        id: get_version
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="$DISPATCH_VERSION"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          # Reject malformed versions before anything is created — a bad tag
          # must not ship to users.
          if ! echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Invalid version '$VERSION' (expected vX.Y.Z, e.g. v0.1.0)"
            exit 1
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Create release
        id: create-release
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RELEASE_VERSION: ${{ steps.get_version.outputs.VERSION }}
        with:
          script: |
            const tag = process.env.RELEASE_VERSION;
            // The release must bind to the commit this run built
            // (context.sha): on workflow_dispatch that is the last commit
            // on the selected ref — exactly what every job checks out —
            // and a NEW tag is created there via target_commitish below.
            // If the tag already exists, resolve it to its commit and
            // refuse when it points anywhere else, BEFORE deleting any
            // draft: assets built from one commit must not ship under a
            // tag that points at another.
            //
            // ONLY a 404 from getRef itself means "the tag is absent" (a
            // new-tag run). Once the ref exists, every step below must
            // verify loudly: a getTag failure (e.g. a pruned tag object
            // behind an existing ref) must FAIL the job, never downgrade
            // the provenance check to "tag absent" and proceed unverified.
            const ref = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `tags/${tag}`
            }).catch((e) => {
              if (e.status !== 404) throw e;
              return null;
            });
            if (ref) {
              // An annotated tag's ref points at a tag object, not a
              // commit — resolve through it to the tagged commit.
              // Deliberately NOT wrapped in a catch: the ref exists, so
              // a failure here must fail the job, not skip verification.
              let taggedSha = ref.data.object.sha;
              if (ref.data.object.type === 'tag') {
                const annotated = await github.rest.git.getTag({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag_sha: taggedSha
                });
                taggedSha = annotated.data.object.sha;
              }
              // Pushing an ANNOTATED tag sets context.sha to the tag
              // object rather than the commit (GITHUB_SHA depends on the
              // event), and that push is what created the tag — accept it.
              // On workflow_dispatch context.sha is always a commit, so
              // this can never excuse a genuine mismatch there.
              if (taggedSha !== context.sha && ref.data.object.sha !== context.sha) {
                core.setFailed(
                  `Tag ${tag} exists and points at commit ${taggedSha}, but this ` +
                  `run built ${context.sha} (event: ${context.eventName}). Refusing ` +
                  `to attach the release to a different commit — move or delete ` +
                  `the tag first.`
                );
                return;
              }
            }
            // Dedupe: a prior run (or a tag re-move) may have left a DRAFT
            // for this tag. Delete drafts only — a published release for this
            // tag means the version already shipped and must NOT be silently
            // removed: refuse loudly instead of deleting live assets.
            try {
              const existing = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag
              });
              if (existing.data.draft) {
                await github.rest.repos.deleteRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: existing.data.id
                });
                console.log(`Deleted superseded draft ${existing.data.id} for ${tag}`);
              } else {
                core.setFailed(
                  `Release ${tag} already exists and is published (id ${existing.data.id}). ` +
                  `Refusing to delete a published release — bump the version instead.`
                );
                return;
              }
            } catch (e) {
              if (e.status !== 404) throw e;
            }
            // target_commitish is unused when the tag already exists (tag
            // pushes), so this only pins NEW (workflow_dispatch) tags —
            // to the commit this run checked out and built.
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: `ClipOCR ${tag}`,
              draft: true,
              prerelease: false
            });
            return data.id;

      # Update-check manifest: written from the tag and uploaded with the
      # other assets. The client (src-tauri/src/update.rs) fetches
      # releases/latest/download/latest.json — a missing asset keeps
      # failing CLOSED client-side (typed "check failed"), never crashes.
      - name: Upload latest.json
        env:
          RELEASE_VERSION: ${{ steps.get_version.outputs.VERSION }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const tag = process.env.RELEASE_VERSION;
            const version = tag.replace(/^v/, '');
            const notes_url = `https://github.com/${context.repo.owner}/${context.repo.repo}/releases/tag/${tag}`;
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ steps.create-release.outputs.result }},
              name: 'latest.json',
              data: JSON.stringify({ version, notes_url }, null, 2) + "\n",
              headers: { 'content-type': 'application/json' }
            });

  # Tests/clippy/fmt must pass before the release is published. Publish
  # (draft:false) is gated on this job — a bad tag or broken build cannot
  # auto-ship to users.
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch as of pinning
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config \
            libtesseract-dev \
            libleptonica-dev \
            tesseract-ocr \
            tesseract-ocr-eng

      - name: Rust formatting check
        run: cargo fmt --all -- --check
        working-directory: src-tauri

      - name: Rust clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

      - name: Rust tests
        run: cargo test
        working-directory: src-tauri

  build-release:
    name: Build Release (${{ matrix.os }})
    needs: create-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Uploads build artifacts to the draft release.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: universal-apple-darwin
            label: macOS
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            label: Linux

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch as of pinning
        with:
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config \
            libtesseract-dev \
            libleptonica-dev \
            tesseract-ocr \
            tesseract-ocr-eng

      # macOS universal binary (arm64 + x86_64), signed with Developer ID and
      # notarized. Tauri's notarization env: APPLE_API_KEY = the ASC Key ID
      # string (e.g. the <api_key> in AuthKey_<api_key>.p8) — NOT the .p8
      # contents — plus APPLE_API_ISSUER and APPLE_API_KEY_PATH (a file path).
      # The .p8 material lives in the APPLE_API_KEY secret; write it to a temp
      # file whose path is APPLE_API_KEY_PATH, and pass the Key ID separately.
      - name: Write Apple notarization key
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          printf '%s' "$APPLE_API_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      - name: Build and upload (macOS universal)
        if: matrix.os == 'macos-latest'
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.P12_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Tauri's APPLE_API_KEY is the ASC Key ID string (the <api_key> in
          # AuthKey_<api_key>.p8), NOT the .p8 contents. The .p8 material goes
          # in the temp file that APPLE_API_KEY_PATH points to (written above).
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --target universal-apple-darwin

      # Windows x64
      - name: Build and upload (Windows)
        if: matrix.os == 'windows-latest'
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --target x86_64-pc-windows-msvc

      # Linux x64
      - name: Build and upload (Linux)
        if: matrix.os == 'ubuntu-24.04'
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --target x86_64-unknown-linux-gnu

  publish-release:
    name: Publish Release
    needs: [create-release, build-release, quality-gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false
            });
