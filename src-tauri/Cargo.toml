[package]
name = "clipocr"
version = "0.3.0"
edition = "2021"
rust-version = "1.88"
description = "Offline menu-bar screen OCR"


[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "net", "io-util"] }
image = { version = "0.25", default-features = false, features = ["png"] }
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
# Update check only: smallest blocking HTTPS client, rustls (no native TLS,
# no async runtime), MSRV-compatible with rust-version = "1.88".
ureq = { version = "2.10", default-features = false, features = ["tls"] }
dirs = "6"
libc = "0.2"
fs2 = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-vision = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Foundation", "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage_Streams", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
windows-capture = "2.0.1"
windows-future = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
tesseract = "0.15"

[dev-dependencies]
tempfile = "3"
